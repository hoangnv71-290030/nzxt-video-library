<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NZXT GitHub Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 640px;
            height: 640px;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(45deg, #1a1a1a, #2a2a2a);
            border: 2px solid #333;
        }

        .settings-panel {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            display: block;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
        }

        .settings-panel::-webkit-scrollbar {
            width: 6px;
        }

        .settings-panel::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .settings-panel::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            color: #4CAF50;
            font-size: 20px;
            font-weight: bold;
        }

        .config-section {
            background: linear-gradient(135deg, #2d2d2d, #3d3d3d);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .config-title {
            color: #4CAF50;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .config-title::before {
            content: "⚙️";
            margin-right: 8px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;
            color: #ccc;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 10px 12px;
            background: #1a1a1a;
            border: 1px solid #555;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .input-field.error {
            border-color: #f44336;
        }

        .video-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 12px;
        }

        .video-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-size: 12px;
        }

        .video-item:hover {
            background: rgba(255,255,255,0.1);
            border-color: #4CAF50;
        }

        .video-item.selected {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4CAF50;
            color: #4CAF50;
        }

        .video-icon {
            font-size: 16px;
            margin-right: 10px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #45a049, #3d8b40);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #666, #777);
            color: white;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #777, #888);
            transform: translateY(-2px);
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: none;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .video-container:hover .video-overlay {
            opacity: 1;
        }

        .overlay-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
            margin: 0 8px;
        }

        .overlay-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .status {
            text-align: center;
            padding: 40px 20px;
            color: #4CAF50;
            font-size: 16px;
        }

        .status.error {
            color: #f44336;
        }

        .status.loading {
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="header">🎬 NZXT Video Player Setup</div>
            
            <div class="config-section">
                <div class="config-title">GitHub Repository</div>
                
                <div class="input-group">
                    <label class="input-label">GitHub Username</label>
                    <input type="text" class="input-field" id="githubUser" placeholder="your-github-username">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Repository Name</label>
                    <input type="text" class="input-field" id="githubRepo" placeholder="nzxt-video-library">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Videos Folder</label>
                    <input type="text" class="input-field" id="videosFolder" placeholder="videos" value="videos">
                </div>
            </div>

            <div class="config-section">
                <div class="config-title">Video Selection</div>
                <div id="videoListContainer">
                    <div class="status" id="videoStatus">Configure repository settings above and click "Load Videos"</div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-secondary" onclick="loadVideos()">Load Videos</button>
                <button class="btn btn-primary" onclick="saveAndPlay()" id="playBtn" disabled>Save & Play</button>
            </div>
        </div>

        <!-- Video Container -->
        <div class="video-container" id="videoContainer">
            <video id="videoPlayer" autoplay loop muted></video>
            <div class="video-overlay">
                <button class="overlay-btn" onclick="showSettings()">⚙️ Settings</button>
                <button class="overlay-btn" onclick="changeVideo()">🎬 Change Video</button>
            </div>
        </div>
    </div>

    <script>
        // Global state object (Zustand-like pattern)
        const store = {
            githubUser: '',
            githubRepo: '',
            videosFolder: 'videos',
            selectedVideo: null,
            videos: [],
            
            // Save state to URL params (NZXT CAM browser shares session data)
            saveState() {
                const params = new URLSearchParams();
                params.set('user', this.githubUser);
                params.set('repo', this.githubRepo);
                params.set('folder', this.videosFolder);
                if (this.selectedVideo) {
                    params.set('video', this.selectedVideo.name);
                }
                
                // Update URL without reload
                const newUrl = window.location.pathname + '?' + params.toString();
                window.history.replaceState({}, '', newUrl);
            },
            
            // Load state from URL params
            loadState() {
                const params = new URLSearchParams(window.location.search);
                this.githubUser = params.get('user') || '';
                this.githubRepo = params.get('repo') || '';
                this.videosFolder = params.get('folder') || 'videos';
                
                // Update UI
                document.getElementById('githubUser').value = this.githubUser;
                document.getElementById('githubRepo').value = this.githubRepo;
                document.getElementById('videosFolder').value = this.videosFolder;
                
                const videoName = params.get('video');
                if (this.githubUser && this.githubRepo && videoName) {
                    // Auto-load and play saved video
                    this.autoLoadVideo(videoName);
                }
            },
            
            async autoLoadVideo(videoName) {
                try {
                    showStatus('Loading saved video...', 'loading');
                    
                    // Try to play the saved video directly
                    const videoURL = `https://raw.githubusercontent.com/${this.githubUser}/${this.githubRepo}/main/${this.videosFolder}/${videoName}`;
                    
                    this.selectedVideo = { name: videoName, url: videoURL };
                    await playVideo();
                    
                } catch (error) {
                    console.error('Auto-load failed:', error);
                    // Fall back to settings panel
                    showSettings();
                }
            }
        };

        // DOM elements
        const settingsPanel = document.getElementById('settingsPanel');
        const videoContainer = document.getElementById('videoContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoStatus = document.getElementById('videoStatus');
        const playBtn = document.getElementById('playBtn');

        // Load videos from GitHub API
        async function loadVideos() {
            const user = document.getElementById('githubUser').value.trim();
            const repo = document.getElementById('githubRepo').value.trim();
            const folder = document.getElementById('videosFolder').value.trim();

            if (!user || !repo) {
                showStatus('Please enter GitHub username and repository name', 'error');
                return;
            }

            showStatus('Loading videos from GitHub...', 'loading');

            try {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: Repository not found or folder doesn't exist`);
                }
                
                const files = await response.json();
                const videoFiles = files.filter(file => 
                    file.type === 'file' && 
                    /\.(mp4|webm|mov|avi)$/i.test(file.name)
                );

                if (videoFiles.length === 0) {
                    showStatus('No video files found in the specified folder', 'error');
                    return;
                }

                // Update store
                store.githubUser = user;
                store.githubRepo = repo;
                store.videosFolder = folder;
                store.videos = videoFiles;

                displayVideoList(videoFiles);
                
            } catch (error) {
                console.error('Error loading videos:', error);
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        // Display video list
        function displayVideoList(videos) {
            const container = document.getElementById('videoListContainer');
            
            let html = `<div class="video-list">`;
            videos.forEach((video, index) => {
                html += `
                    <div class="video-item" onclick="selectVideo(${index})">
                        <span class="video-icon">🎥</span>
                        <span>${video.name}</span>
                    </div>
                `;
            });
            html += `</div>`;
            
            container.innerHTML = html;
            playBtn.disabled = false;
        }

        // Select video
        function selectVideo(index) {
            // Update UI
            document.querySelectorAll('.video-item').forEach(item => item.classList.remove('selected'));
            event.target.closest('.video-item').classList.add('selected');
            
            // Update store
            store.selectedVideo = store.videos[index];
        }

        // Save settings and play video
        async function saveAndPlay() {
            if (!store.selectedVideo) {
                showStatus('Please select a video first', 'error');
                return;
            }

            // Save state to URL
            store.saveState();
            
            // Play video
            await playVideo();
        }

        // Play video
        async function playVideo() {
            if (!store.selectedVideo) return;

            const videoURL = `https://raw.githubusercontent.com/${store.githubUser}/${store.githubRepo}/main/${store.videosFolder}/${store.selectedVideo.name}`;
            
            showVideoContainer();
            
            videoPlayer.src = videoURL;
            videoPlayer.onloadeddata = () => {
                console.log('Video loaded:', store.selectedVideo.name);
            };

            videoPlayer.onerror = (e) => {
                console.error('Video load error:', e);
                showStatus('Error loading video file', 'error');
                showSettings();
            };
        }

        // UI Functions
        function showVideoContainer() {
            settingsPanel.style.display = 'none';
            videoContainer.style.display = 'block';
        }

        function showSettings() {
            videoContainer.style.display = 'none';
            settingsPanel.style.display = 'block';
        }

        function changeVideo() {
            if (store.videos.length > 0) {
                displayVideoList(store.videos);
            }
            showSettings();
        }

        function showStatus(message, type = '') {
            videoStatus.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        // Initialize app
        window.addEventListener('load', () => {
            store.loadState();
            
            // Auto-load videos if we have saved settings
            if (store.githubUser && store.githubRepo && store.videos.length === 0) {
                loadVideos();
            }
        });

        // Video loop handler
        videoPlayer.addEventListener('ended', () => {
            videoPlayer.currentTime = 0;
            videoPlayer.play();
        });
    </script>
</body>
</html>
