<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NZXT GitHub Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            width: 320px;
            height: 320px;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(45deg, #1a1a1a, #2a2a2a);
            border: 2px solid #333;
        }

        .video-list {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 16px;
            display: block;
        }

        .video-list::-webkit-scrollbar {
            width: 4px;
        }

        .video-list::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .video-list::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 2px;
        }

        .video-item {
            background: linear-gradient(135deg, #2d2d2d, #3d3d3d);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .video-item:hover {
            background: linear-gradient(135deg, #3d3d3d, #4d4d4d);
            border-color: #555;
            transform: translateX(4px);
        }

        .video-item.active {
            background: linear-gradient(135deg, #2d4d2d, #3d5d3d);
            border-color: #4CAF50;
        }

        .video-icon {
            font-size: 20px;
            margin-right: 12px;
            color: #4CAF50;
        }

        .video-name {
            font-size: 12px;
            color: #ccc;
            word-break: break-word;
            flex: 1;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: none;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .video-container:hover .video-overlay {
            opacity: 1;
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            color: #4CAF50;
            font-size: 16px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px 16px;
            color: #4CAF50;
            font-size: 14px;
        }

        .error {
            text-align: center;
            padding: 40px 16px;
            color: #f44336;
            font-size: 12px;
        }

        .refresh-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Video List -->
        <div class="video-list" id="videoList">
            <div class="header">🎬 Video Library</div>
            <div class="loading" id="loading">Loading videos...</div>
        </div>

        <!-- Video Container -->
        <div class="video-container" id="videoContainer">
            <video id="videoPlayer" autoplay loop muted></video>
            <div class="video-overlay">
                <button class="back-btn" onclick="showVideoList()">← Back to Library</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration - Change these to match your repo
        const GITHUB_USER = 'yourusername';  // Change this!
        const GITHUB_REPO = 'nzxt-video-library';  // Change this!
        const VIDEOS_FOLDER = 'videos';

        const videoList = document.getElementById('videoList');
        const videoContainer = document.getElementById('videoContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const loading = document.getElementById('loading');

        // Load videos from GitHub
        async function loadVideos() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${VIDEOS_FOLDER}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const files = await response.json();
                
                // Filter video files
                const videoFiles = files.filter(file => 
                    file.type === 'file' && 
                    /\.(mp4|webm|mov|avi)$/i.test(file.name)
                );

                if (videoFiles.length === 0) {
                    showError('No video files found in repository.<br><br>Please add videos to the "videos" folder in your GitHub repo.');
                    return;
                }

                displayVideoList(videoFiles);
                
            } catch (error) {
                console.error('Error loading videos:', error);
                showError(`Error loading videos: ${error.message}<br><br>Please check your GitHub repository settings.`);
            }
        }

        function displayVideoList(videos) {
            loading.style.display = 'none';
            
            videos.forEach(video => {
                const videoItem = document.createElement('div');
                videoItem.className = 'video-item';
                videoItem.innerHTML = `
                    <div class="video-icon">🎥</div>
                    <div class="video-name">${video.name}</div>
                `;
                
                videoItem.onclick = () => playVideo(video);
                videoList.appendChild(videoItem);
            });
        }

        function playVideo(video) {
            // GitHub raw URL
            const videoURL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${VIDEOS_FOLDER}/${video.name}`;
            
            // Show loading
            videoPlayer.src = '';
            showVideoContainer();
            
            // Load video
            videoPlayer.src = videoURL;
            videoPlayer.onloadeddata = () => {
                console.log('Video loaded successfully');
            };

            videoPlayer.onerror = (e) => {
                console.error('Video load error:', e);
                alert('Error loading video. Please check if the file exists and is accessible.');
                showVideoList();
            };

            // Mark as active
            document.querySelectorAll('.video-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.video-item').classList.add('active');
        }

        function showVideoContainer() {
            videoList.style.display = 'none';
            videoContainer.style.display = 'block';
        }

        function showVideoList() {
            videoContainer.style.display = 'none';
            videoList.style.display = 'block';
        }

        function showError(message) {
            loading.innerHTML = `
                <div class="error">
                    ${message}
                    <br><br>
                    <button class="refresh-btn" onclick="location.reload()">Retry</button>
                </div>
            `;
        }

        // Initialize
        loadVideos();

        // Video ended handler
        videoPlayer.addEventListener('ended', () => {
            videoPlayer.currentTime = 0;
            videoPlayer.play();
        });
    </script>
</body>
</html>
