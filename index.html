<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NZXT GitHub Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            width: 640px;
            height: 640px;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(45deg, #1a1a1a, #2a2a2a);
            border: 2px solid #333;
        }

        /* Configuration Browser Styles */
        .config-container {
            width: 100%;
            height: 100%;
            padding: 20px;
            overflow-y: auto;
        }

        .config-header {
            text-align: center;
            margin-bottom: 24px;
            color: #4CAF50;
            font-size: 20px;
            font-weight: bold;
        }

        .config-section {
            background: linear-gradient(135deg, #2d2d2d, #3d3d3d);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #444;
        }

        .section-title {
            color: #4CAF50;
            font-size: 14px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-label {
            display: block;
            color: #ccc;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .input-field {
            width: 100%;
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
        }

        .input-field:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 4px rgba(76, 175, 80, 0.3);
        }

        .video-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #555;
            border-radius: 4px;
            background: #1a1a1a;
        }

        .video-item {
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            font-size: 12px;
        }

        .video-item:hover {
            background: #333;
        }

        .video-item.active {
            background: #2d4d2d;
            color: #4CAF50;
        }

        .video-icon {
            margin-right: 8px;
            color: #4CAF50;
        }

        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 8px;
        }

        .btn:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        .status {
            text-align: center;
            padding: 12px;
            border-radius: 4px;
            margin-top: 12px;
            font-size: 12px;
        }

        .status.success {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .status.error {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        /* Kraken Browser Styles */
        .kraken-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #4CAF50;
            font-size: 16px;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            color: #f44336;
            font-size: 14px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- Configuration Browser View -->
        <div class="config-container" id="configContainer">
            <div class="config-header">🎬 Video Player Configuration</div>
            
            <div class="config-section">
                <div class="section-title">GitHub Repository Settings</div>
                <div class="input-group">
                    <label class="input-label">GitHub Username</label>
                    <input type="text" class="input-field" id="githubUser" placeholder="your-username">
                </div>
                <div class="input-group">
                    <label class="input-label">Repository Name</label>
                    <input type="text" class="input-field" id="githubRepo" placeholder="nzxt-video-library">
                </div>
                <div class="input-group">
                    <label class="input-label">Videos Folder</label>
                    <input type="text" class="input-field" id="videosFolder" placeholder="videos" value="videos">
                </div>
                <button class="btn" onclick="loadVideoList()">Load Video List</button>
            </div>

            <div class="config-section" id="videoSection" style="display: none;">
                <div class="section-title">Select Default Video</div>
                <div class="video-list" id="videoList">
                    <!-- Videos will be loaded here -->
                </div>
                <div id="status" class="status" style="display: none;"></div>
            </div>
        </div>

        <!-- Kraken Browser View -->
        <div class="kraken-container" id="krakenContainer" style="display: none;">
            <video id="videoPlayer" autoplay loop muted></video>
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <div>Loading video...</div>
            </div>
            <div class="error-message" id="errorMessage" style="display: none;">
                No video selected. Please configure in NZXT CAM settings.
            </div>
        </div>
    </div>

    <script>
        // Check if we're in Kraken browser or Configuration browser
        const searchParams = new URLSearchParams(window.location.search);
        const isKraken = searchParams.get("kraken") === "1";

        const configContainer = document.getElementById('configContainer');
        const krakenContainer = document.getElementById('krakenContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorMessage = document.getElementById('errorMessage');

        // Storage keys
        const STORAGE_KEYS = {
            GITHUB_USER: 'nzxt_github_user',
            GITHUB_REPO: 'nzxt_github_repo',
            VIDEOS_FOLDER: 'nzxt_videos_folder',
            SELECTED_VIDEO: 'nzxt_selected_video',
            VIDEOS_LIST: 'nzxt_videos_list'
        };

        if (isKraken) {
            // Kraken Browser - Display video
            showKrakenView();
        } else {
            // Configuration Browser - Show settings
            showConfigView();
        }

        function showKrakenView() {
            configContainer.style.display = 'none';
            krakenContainer.style.display = 'flex';
            
            // Load saved settings and play video
            loadAndPlayVideo();
            
            // Listen for settings changes from Configuration Browser
            window.addEventListener('storage', (event) => {
                if (event.key === STORAGE_KEYS.SELECTED_VIDEO) {
                    loadAndPlayVideo();
                }
            });
        }

        function showConfigView() {
            krakenContainer.style.display = 'none';
            configContainer.style.display = 'block';
            
            // Load saved settings
            loadSavedSettings();
        }

        function loadSavedSettings() {
            const githubUser = localStorage.getItem(STORAGE_KEYS.GITHUB_USER) || '';
            const githubRepo = localStorage.getItem(STORAGE_KEYS.GITHUB_REPO) || '';
            const videosFolder = localStorage.getItem(STORAGE_KEYS.VIDEOS_FOLDER) || 'videos';
            
            document.getElementById('githubUser').value = githubUser;
            document.getElementById('githubRepo').value = githubRepo;
            document.getElementById('videosFolder').value = videosFolder;
            
            // Auto-load video list if settings exist
            if (githubUser && githubRepo) {
                loadVideoList();
            }
        }

        async function loadVideoList() {
            const githubUser = document.getElementById('githubUser').value.trim();
            const githubRepo = document.getElementById('githubRepo').value.trim();
            const videosFolder = document.getElementById('videosFolder').value.trim() || 'videos';
            
            if (!githubUser || !githubRepo) {
                showStatus('Please fill in GitHub username and repository name', 'error');
                return;
            }
            
            // Save settings
            localStorage.setItem(STORAGE_KEYS.GITHUB_USER, githubUser);
            localStorage.setItem(STORAGE_KEYS.GITHUB_REPO, githubRepo);
            localStorage.setItem(STORAGE_KEYS.VIDEOS_FOLDER, videosFolder);
            
            showStatus('Loading videos...', 'success');
            
            try {
                const response = await fetch(`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${videosFolder}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const files = await response.json();
                
                // Filter video files
                const videoFiles = files.filter(file => 
                    file.type === 'file' && 
                    /\.(mp4|webm|mov|avi)$/i.test(file.name)
                );

                if (videoFiles.length === 0) {
                    showStatus('No video files found in repository', 'error');
                    return;
                }

                displayVideoList(videoFiles);
                showStatus(`Found ${videoFiles.length} videos`, 'success');
                
                // Save videos list
                localStorage.setItem(STORAGE_KEYS.VIDEOS_LIST, JSON.stringify(videoFiles));
                
            } catch (error) {
                console.error('Error loading videos:', error);
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        function displayVideoList(videos) {
            const videoList = document.getElementById('videoList');
            const selectedVideoData = localStorage.getItem(STORAGE_KEYS.SELECTED_VIDEO);
            let selectedVideoName = null;
            
            if (selectedVideoData) {
                try {
                    selectedVideoName = JSON.parse(selectedVideoData).name;
                } catch (e) {
                    // Invalid data, ignore
                }
            }
            
            videoList.innerHTML = '';
            
            videos.forEach(video => {
                const videoItem = document.createElement('div');
                videoItem.className = 'video-item';
                if (video.name === selectedVideoName) {
                    videoItem.classList.add('active');
                }
                
                videoItem.innerHTML = `
                    <span class="video-icon">🎥</span>
                    <span>${video.name}</span>
                `;
                
                videoItem.onclick = () => selectVideo(video, videoItem);
                videoList.appendChild(videoItem);
            });
            
            document.getElementById('videoSection').style.display = 'block';
        }

        function selectVideo(video, element) {
            // Update UI
            document.querySelectorAll('.video-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');
            
            // Save selection and trigger storage event for Kraken Browser
            const githubUser = localStorage.getItem(STORAGE_KEYS.GITHUB_USER);
            const githubRepo = localStorage.getItem(STORAGE_KEYS.GITHUB_REPO);
            const videosFolder = localStorage.getItem(STORAGE_KEYS.VIDEOS_FOLDER) || 'videos';
            
            const videoData = {
                name: video.name,
                url: `https://raw.githubusercontent.com/${githubUser}/${githubRepo}/main/${videosFolder}/${video.name}`
            };
            
            localStorage.setItem(STORAGE_KEYS.SELECTED_VIDEO, JSON.stringify(videoData));
            
            showStatus(`Selected: ${video.name}`, 'success');
        }

        function loadAndPlayVideo() {
            const selectedVideoData = localStorage.getItem(STORAGE_KEYS.SELECTED_VIDEO);
            
            if (!selectedVideoData) {
                showError('Please select a video in settings');
                return;
            }
            
            try {
                const videoData = JSON.parse(selectedVideoData);
                const videoURL = videoData.url;
                
                loadingOverlay.style.display = 'flex';
                errorMessage.style.display = 'none';
                
                videoPlayer.src = videoURL;
                videoPlayer.onloadeddata = () => {
                    loadingOverlay.style.display = 'none';
                };

                videoPlayer.onerror = (e) => {
                    console.error('Video load error:', e);
                    showError('Error loading video. Please check your settings.');
                };
                
            } catch (error) {
                showError('Invalid video data. Please reconfigure in settings.');
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    status.style.display = 'none';
                }, 3000);
            }
        }

        function showError(message) {
            loadingOverlay.style.display = 'none';
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        // Video ended handler
        videoPlayer.addEventListener('ended', () => {
            videoPlayer.currentTime = 0;
            videoPlayer.play();
        });
    </script>
</body>
</html>
